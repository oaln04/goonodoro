<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <title>Project Goonodoro</title>

    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container"
        <h1>Project Goonodoro</h1>
        <p>A Pomodoro timer for the gooniverse.</p>

        <div class="card">
            <h2 id="mode">Ready to lock in?</h2>
            <h2 id="timer">25:00</h2>
            <label>
                Work Duration:
                <input type="number" id="workDuration" placeholder="25" min="1" max="60">
            </label>
            <label>
                Goon Duration:
                <input type="number" id="goonDuration" placeholder="5" min="1" max="30">
            </label>
            <button id="start">Start</button>
            <button id="pause">Pause</button>
            <button id="reset">Reset</button>
            <p id="sessionCount">Sessions Completed: 0</p>
        </div>
    </div>
        <script src="script.js"></script>
        </body>
        </html>
