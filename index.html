<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Goonodoro</title>

    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Project Goonodoro</h1>
        <p>A Pomodoro timer for the gooniverse.</p>

        <div class="card">
            <h2 id="mode">Ready to lock in?</h2>
            <h2 id="timer">25:00</h2>
            <button id="start">Start</button>
            <button id="pause">Pause</button>
            <button id="reset">Reset</button>
            <p id="sessionCount">Sessions: 0</p>
        </div>

        <script src="script.js"></script>
        </body>
        </html>
