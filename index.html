<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <title>Project Goonodoro</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍆</text></svg>">
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
        <h1>Project Goonodoro</h1>
        <p>A Pomodoro timer for the gooniverse.</p>

        <div class="card">
            <h2 id="mode">Ready to lock in?</h2>
            <h2 id="timer">25:00</h2>

            <div class="input-row">
            <label>
                Work Duration:
                <input type="number" id="workDuration" placeholder="25" min="1" max="60">
            </label>
            <label>
                Goon Duration:
                <input type="number" id="goonDuration" placeholder="5" min="1" max="30">
            </label>
            </div>

            <div class="button-row">
            <button id="start">Start</button>
            <button id="pause">Pause</button>
            </div>

            <div class ="reset-row">
            <button id="reset">Reset</button>
            </div>

            <p id="sessionCount">Sessions Completed: 0</p>
            <div id="overlay" class="overlay"></div>
        </div>
    </div>
        <script src="script.js"></script>
        </body>
        </html>
